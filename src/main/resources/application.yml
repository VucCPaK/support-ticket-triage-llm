spring:
  application.name: ticket-triage

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway owns the schema, Hibernate only checks entities against it

  flyway:
    clean-disabled: true

  mvc:
    problemdetails:
      enabled: true  # validation and framework errors as RFC 9457 ProblemDetail

  # Local dev: OPENAI_API_KEY=... in .env (gitignored). Prod: the same name as a real environment variable.
  config:
    import: optional:file:.env[.properties]

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: 30s
      max-retries: 2
      chat:
        model: gpt-6-luna

llm:
  triage:
    prompt-version: 2
    # Empty = the model default. low was rejected in experiments 1 and 2: it misses order numbers.
    reasoning-effort:
  draft:
    reply-version: 2
  pricing:            # USD per 1M tokens, checked 2026-10-03
    "[gpt-6-luna]":
      input: 0.10
      output: 0.50
    "[gpt-6.1-sol]":
      input: 2.00
      output: 10.00
