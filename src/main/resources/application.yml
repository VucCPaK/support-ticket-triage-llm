spring:
  application.name: ticket-triage

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway owns the schema, Hibernate only checks entities against it

  flyway:
    clean-disabled: true

  mvc:
    problemdetails:
      enabled: true  # validation and framework errors as RFC 9457 ProblemDetail

  # Local dev: OPENAI_API_KEY=... in .env (gitignored). Prod: the same name as a real environment variable.
  config:
    import: optional:file:.env[.properties]

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      timeout: 12s
      max-retries: 1
      chat:
        model: gpt-6-luna

management:
  endpoints:
    web:
      exposure:
        include: health, metrics  # local only; the public deployment in step 6 needs these protected

tickets:
  recovery:
    enabled: false       # retries call the model: every recovered ticket is a paid triage (+ draft)
    interval: PT1M       # ISO-8601: @Scheduled parses this string itself
    lease: 4m           # checked at startup against the worst case of one ticket (now ~3m12s with margin)
    stale-after: 5m     # also checked at startup: a new ticket still processing must not look abandoned
    max-attempts: 5     # backoff 1, 4, 16, 64, 256 minutes, then a human takes over
    batch-size: 10

llm:
  triage:
    prompt-version: 3
    # Empty = the model default. low was rejected in experiments 1 and 2: it misses order numbers.
    reasoning-effort:
  draft:
    reply-version: 2
  fallback:
    model: gpt-5-nano   # not run through the eval: accepted as is to keep tickets triaged during outages
  budget:
    daily-usd: 1.00     # ~2,600 tickets a day at the measured $0.00038 per ticket
  pricing:            # USD per 1M tokens, checked 2026-10-03
    "[gpt-6-luna]":
      input: 0.10
      output: 0.50
    "[gpt-5-nano]":     # verify against the provider's price page
      input: 0.05
      output: 0.40
    "[gpt-6.1-sol]":
      input: 2.00
      output: 10.00
